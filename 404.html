<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="The requested page could not be found.">

    <meta name="robots" content="noindex">

    <meta name="theme-color" content="#e2540b">

    <title>404 - Page Not Found - Maximanu.DE</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="mask-icon" href="/favicon.svg" color="#e2540b">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    >

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">

    <script>
        (function () {
            var stored = localStorage.getItem("theme");
            var theme = stored === "light" || stored === "dark"
                ? stored
                : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>

<body>
    <div id="header"></div>

    <main class="error-page">
        <div class="container">
            <div class="error-code">404</div>

            <h1>
                Page not found.
            </h1>

            <p class="lead">
                The page you're looking for doesn't exist or may have
                been moved somewhere else.
            </p>

            <div class="hero-actions">
                <a href="/" class="btn btn-primary">
                    <i class="bi bi-house"></i>
                    Back Home
                </a>

                <a href="/projects/" class="btn btn-secondary">
                    View Projects
                </a>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="/js/main.js"></script>
</body>
</html>
